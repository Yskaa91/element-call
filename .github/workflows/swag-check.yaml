name: swag check
on:
  push:
    branches: ["swag"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # action-setup reads the exact pnpm version from package.json's
      # packageManager field; passing it here too is an error.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # ignore-pnpmfile should never be committed; CI must crash if it happened.
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Unit tests
        run: pnpm exec vitest run --project unit src/swag src/widget.test.ts src/HostBridge.test.ts src/state/CallViewModel/localMember/Publisher.test.ts src/components/CallFooter.test.tsx
      - name: Type-check
        run: pnpm run lint:types
